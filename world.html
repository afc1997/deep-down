<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DEEP DOWN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="world.css" />
</head>
<body>

  <!-- Terrain canvas -->
  <canvas id="map-canvas"></canvas>

  <!-- Atmosphere canvas (fog + rain, drawn over map) -->
  <canvas id="atmo-canvas"></canvas>

  <!-- Cover / title screen -->
  <div id="title-screen">
    <p class="t-writer">A film by Fisherman &amp; Trout</p>
    <h1 class="t-title">DEEP<br>DOWN</h1>
    <p class="t-hint">Arrow keys to explore</p>
  </div>

  <!-- Location prompt (floats above Quinn) -->
  <div id="loc-prompt">
    <span id="loc-name"></span>
    <span id="loc-key">[ E ]</span>
  </div>

  <!-- Content panel (slides in from right) -->
  <div id="content-panel" aria-hidden="true">
    <button id="btn-close" aria-label="Close">&#215;</button>
    <div id="content-body"></div>
    <div id="content-footer">
      <button id="btn-prev" aria-label="Previous">&#8592;</button>
      <span id="slide-counter"></span>
      <button id="btn-next" aria-label="Next">&#8594;</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="world-engine.js"></script>
</body>
</html>
